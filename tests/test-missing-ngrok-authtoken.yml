name: Test missing ngrok-authtoken fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          ngrok-authtoken: ""
          github-token: ${{ github.token }}
          interactive: |
            fields:
              - label: my-text
                properties:
                  display: Enter some text
                  type: text
                  required: false

      - name: Assert action failed due to missing ngrok-authtoken
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ngrok-authtoken is empty, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when ngrok-authtoken was not provided"
