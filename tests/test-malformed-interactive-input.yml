name: Test malformed interactive input fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          ngrok-authtoken: "fake-ngrok-token-for-validation-test"
          github-token: ${{ github.token }}
          interactive: |
            this is: not: valid: fields: yaml: [[[

      - name: Assert action failed due to malformed interactive input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when interactive input is malformed YAML, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when interactive input was malformed"
