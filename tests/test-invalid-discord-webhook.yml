name: Test invalid Discord webhook error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with Discord enabled but default/invalid webhook (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ngrok-authtoken: "fake-ngrok-token-for-testing"
          github-token: ${{ github.token }}
          notifier-discord-enabled: "true"
          notifier-discord-webhook: "secret-webhook"
          interactive: |
            fields:
              - label: my-field
                properties:
                  display: Enter a value
                  type: text
                  required: false

      - name: Assert action failed due to invalid Discord webhook
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when default Discord webhook is used"
            exit 1
          fi
          echo "PASS: action correctly failed when default Discord webhook was provided"
