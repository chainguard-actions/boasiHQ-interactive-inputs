name: Test with Discord notifier enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "Discord Notifier Test Form"
          interactive: |
            fields:
              - label: confirm
                properties:
                  display: Confirm deployment
                  type: text
                  description: Type yes to confirm
                  maxLength: 3
                  required: true
          timeout: "5"
          ngrok-authtoken: "invalid-ngrok-token-for-testing"
          github-token: "fake-github-token"
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "true"
          notifier-discord-webhook: "https://discord.com/api/webhooks/fake/webhook"
          notifier-discord-username: "deploy-bot"
          notifier-discord-thread-id: "123456789"

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when Discord notifier is enabled"
