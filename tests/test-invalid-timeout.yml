name: Test invalid timeout value error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-numeric timeout (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ngrok-authtoken: "fake-ngrok-token-for-testing"
          github-token: ${{ github.token }}
          timeout: "not-a-number"
          interactive: |
            fields:
              - label: my-field
                properties:
                  display: Enter a value
                  type: text
                  required: false

      - name: Assert action failed due to invalid timeout
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when non-numeric timeout is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when invalid timeout value was provided"
