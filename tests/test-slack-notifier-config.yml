name: Test with Slack notifier enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "Test Interactive Form"
          interactive: |
            fields:
              - label: environment
                properties:
                  display: Select environment
                  type: select
                  description: Choose deployment environment
                  choices: ["dev", "staging", "prod"]
                  required: true
          timeout: "5"
          ngrok-authtoken: "invalid-ngrok-token-for-testing"
          github-token: "fake-github-token"
          notifier-slack-enabled: "true"
          notifier-slack-token: "xoxb-fake-slack-token"
          notifier-slack-channel: "#deployments"
          notifier-slack-bot: "deploy-bot"
          notifier-discord-enabled: "false"

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when Slack notifier is enabled"
