name: Test basic invocation with invalid ngrok token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interactive: |
            fields:
              - label: my-input
                properties:
                  display: Enter a value
                  type: text
                  description: A simple text input
                  required: false
          timeout: "5"
          ngrok-authtoken: "invalid-ngrok-token-for-testing"
          github-token: "fake-github-token"
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "false"

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid ngrok token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
