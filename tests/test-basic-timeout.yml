name: Test basic invocation with short timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action invocation with short timeout
        id: action
        uses: .
        continue-on-error: true
        with:
          title: "Test Form"
          interactive: |
            fields:
              - label: test-field
                properties:
                  display: Enter a test value
                  type: text
                  description: A simple text field for testing
                  required: false
          timeout: "5"
          ngrok-authtoken: "fake-ngrok-token-for-testing"
          github-token: "fake-github-token"
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "false"

      - name: Assert action was invoked (expected to fail due to invalid ngrok token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either fail (invalid ngrok token) or timeout
          # Either way, it should not succeed with a fake token
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded with fake credentials"
          else
            echo "PASS: action correctly failed with invalid credentials (outcome: $OUTCOME)"
          fi
