name: Test with Discord notifier configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with Discord notifier enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          title: "Discord Notifier Test Form"
          interactive: |
            fields:
              - label: random-string
                properties:
                  display: Enter a random string
                  type: text
                  description: A random string up to 20 characters long
                  maxLength: 20
                  required: false
          timeout: "5"
          ngrok-authtoken: "fake-ngrok-token-for-testing"
          github-token: "fake-github-token"
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "true"
          notifier-discord-webhook: "https://discord.com/api/webhooks/fake/webhook"
          notifier-discord-username: "test-bot"
          notifier-discord-thread-id: "123456789"

      - name: Assert action was invoked with Discord config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail due to invalid ngrok/discord tokens
          # We verify it was invoked and did not hang indefinitely
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded with fake credentials"
          else
            echo "PASS: action correctly failed with invalid credentials (outcome: $OUTCOME)"
          fi
