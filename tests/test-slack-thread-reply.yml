name: Test Slack Thread Reply (notifier-slack-thread-ts coverage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "Thread Reply Test"
          interactive: |
            fields:
              - label: simple-text
                properties:
                  display: Enter some text
                  type: text
                  required: false
          timeout: "5"
          ngrok-authtoken: "invalid-ngrok-token-for-testing"
          github-token: ${{ github.token }}
          notifier-slack-enabled: "true"
          notifier-slack-token: "xoxb-invalid-slack-token"
          notifier-slack-channel: "#test-notifications"
          notifier-slack-bot: "test-bot"
          notifier-slack-thread-ts: "1234567890.123456"
      - name: Assert action ran (input coverage check)
        run: |
          echo "Action completed (with or without error) — notifier-slack-thread-ts input was exercised"
          echo "PASS: notifier-slack-thread-ts input is covered"
