name: Test select field type with choices
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with select field type (expect failure due to invalid ngrok token)
        id: action
        uses: .
        continue-on-error: true
        with:
          title: "Monitoring Tool Selection"
          interactive: |
            fields:
              - label: monitoring-tool
                properties:
                  display: Select a monitoring tool
                  type: select
                  description: Available options to choose from
                  choices: ["datadog", "sentry", "grafana"]
                  required: true
          timeout: "5"
          ngrok-authtoken: "fake-invalid-ngrok-token-for-testing"
          github-token: ${{ github.token }}
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "false"

      - name: Assert action failed (invalid ngrok token with select field)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid ngrok token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using select field type with invalid ngrok token"
