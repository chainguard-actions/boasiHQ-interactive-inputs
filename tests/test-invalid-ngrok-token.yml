name: Test invalid ngrok token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid ngrok token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          title: "Test Form"
          interactive: |
            fields:
              - label: test-field
                properties:
                  display: Enter a value
                  type: text
                  required: false
          timeout: "5"
          ngrok-authtoken: "fake-invalid-ngrok-token-for-testing"
          github-token: ${{ github.token }}
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "false"

      - name: Assert action failed due to invalid ngrok token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid ngrok token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid ngrok token"
