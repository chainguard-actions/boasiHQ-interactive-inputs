name: Test Discord Notifier Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "Discord Notifier Test"
          interactive: |
            fields:
              - label: test-field
                properties:
                  display: Enter a value
                  type: text
                  required: false
          timeout: "5"
          ngrok-authtoken: "fake-ngrok-token-for-coverage"
          github-token: ${{ github.token }}
          notifier-slack-enabled: "false"
          notifier-slack-token: ""
          notifier-slack-channel: "#notifications"
          notifier-discord-enabled: "true"
          notifier-discord-webhook: "https://discord.com/api/webhooks/fake/webhook"
          notifier-discord-username: "TestBot"
          notifier-discord-thread-id: "123456789012345678"
      - name: Assert action ran (coverage check)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail due to invalid ngrok token,
          # but we only need to verify it was invoked with the discord inputs.
          # Any outcome (success or failure) is acceptable here.
          echo "PASS: Discord notifier inputs were passed to the action"
