name: Test invalid interactive YAML fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid interactive YAML (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          title: "Test Form"
          interactive: |
            this is: not: valid: yaml: [unclosed bracket
            fields: :::
          timeout: "5"
          ngrok-authtoken: "fake-invalid-ngrok-token-for-testing"
          github-token: ${{ github.token }}
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "false"

      - name: Assert action failed due to invalid YAML
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid interactive YAML, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid interactive YAML"
