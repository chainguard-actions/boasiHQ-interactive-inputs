name: Test invalid Discord webhook fails when Discord notifier enabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          ngrok-authtoken: "fake-ngrok-token-for-validation-test"
          github-token: ${{ github.token }}
          notifier-discord-enabled: "true"
          notifier-discord-webhook: "secret-webhook"
          interactive: |
            fields:
              - label: my-text
                properties:
                  display: Enter some text
                  type: text
                  required: false

      - name: Assert action failed due to invalid Discord webhook
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Discord notifier is enabled with placeholder webhook, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Discord notifier was enabled with the default placeholder webhook"
