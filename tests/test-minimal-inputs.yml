name: Test minimal required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 2
        with:
          interactive: |
            fields:
              - label: my-text
                properties:
                  display: Enter some text
                  type: text
                  required: false
          timeout: "5"
          ngrok-authtoken: "invalid-ngrok-token"
          github-token: "fake-github-token"
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "false"

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run and either fail (bad ngrok token) or succeed
          # It must not be 'skipped'
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked, outcome=$OUTCOME"
