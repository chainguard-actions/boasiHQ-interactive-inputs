name: Test invalid Slack token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with Slack enabled but default/invalid token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ngrok-authtoken: "fake-ngrok-token-for-testing"
          github-token: ${{ github.token }}
          notifier-slack-enabled: "true"
          notifier-slack-token: "xoxb-secret-token"
          notifier-slack-channel: "#test-channel"
          interactive: |
            fields:
              - label: my-field
                properties:
                  display: Enter a value
                  type: text
                  required: false

      - name: Assert action failed due to invalid Slack token
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when default Slack token is used"
            exit 1
          fi
          echo "PASS: action correctly failed when default Slack token was provided"
