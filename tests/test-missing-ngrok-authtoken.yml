name: Test missing ngrok-authtoken error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without ngrok-authtoken (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ngrok-authtoken: ""
          github-token: ${{ github.token }}
          interactive: |
            fields:
              - label: my-field
                properties:
                  display: Enter a value
                  type: text
                  required: false

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when ngrok-authtoken is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when ngrok-authtoken was not provided"
