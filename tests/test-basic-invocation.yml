name: Test basic invocation with invalid ngrok token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 2
        with:
          title: "Test Form"
          interactive: |
            fields:
              - label: test-field
                properties:
                  display: Enter a value
                  type: text
                  required: false
          timeout: "5"
          ngrok-authtoken: "invalid-token-for-testing"
          github-token: "fake-github-token"
          notifier-slack-enabled: "false"
          notifier-discord-enabled: "false"

      - name: Assert action ran (even if it failed due to invalid ngrok token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either fail (due to invalid ngrok token) or succeed
          # It should NOT be 'skipped' which would indicate it never ran
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
